<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Controle de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .item {
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1>Lista de Compras</h1>

    {% if compras %}

        {% for item in compras %}

            <div class="item">
                Comprar:
                {{ item.quantidade }}
                {{ item.unidade }}
                de
                {{ item.nome }}
            </div>

        {% endfor %}

    {% else %}

        <p>Não há itens para comprar.</p>

    {% endif %}

</body>

</html>
